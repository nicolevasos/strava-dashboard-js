<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Strava Polylines Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Welcome Modal -->
<div id="welcomeModal">
  <div class="modal-content">
    <h2>Welcome to My Activity Dashboard!</h2>
    <p>Upload your Strava CSV file and explore your activities.</p>
    <button id="closeModal">Got it!</button>
  </div>
</div>

<!-- Top Banner -->
<div id="topBanner">
  <img src="images/strava.png" class="logo" />
  <h1>My Activity Tracker</h1>
  <img src="images/NS.png" class="strava-logo" />
</div>

<!-- Controls -->
<div id="controls">
  <label>
    Upload CSV:
    <input type="file" id="fileInput" accept=".csv" />
  </label>

  <label>
    Filter by Sport:
    <select id="sportFilter">
      <option value="all">All Sports</option>
    </select>
  </label>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div id="map"></div>
  <canvas id="activityChart"></canvas>
</div>

<!-- Libraries -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mapbox/polyline@1.1.1/src/polyline.min.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- App JS -->
<script src="script.js"></script>

</body>
</html>
